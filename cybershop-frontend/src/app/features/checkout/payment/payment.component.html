<div class="payment-container">
  <div class="payment-card">
    <h2>SECURE PAYMENT GATEWAY</h2>
    <p class="total-display">Amount to Secure: <strong>{{ totalAmount() | currency }}</strong></p>

    <form (ngSubmit)="processPayment()" #paymentForm="ngForm">
      <div class="form-group">
        <label>Name on Card</label>
        <input type="text" name="cardName" [(ngModel)]="paymentData.cardName" placeholder="JOHN DOE" required>
      </div>

      <div class="form-group">
        <label>Card Number</label>
        <input type="text" name="cardNumber" [(ngModel)]="paymentData.cardNumber" placeholder="0000 0000 0000 0000" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Expiry</label>
          <input type="text" name="expiry" [(ngModel)]="paymentData.expiry" placeholder="MM/YY" required>
        </div>
        <div class="form-group">
          <label>CVV</label>
          <input type="password" name="cvv" [(ngModel)]="paymentData.cvv" placeholder="***" required>
        </div>
      </div>

      <div class="form-group">
        <label>Billing Location</label>
        <input type="text" name="location" [(ngModel)]="paymentData.billingAddress" readonly>
      </div>

      <button type="submit" class="btn-verify" [disabled]="!paymentForm.valid || isProcessing()">
        {{ isProcessing() ? 'ENCRYPTING...' : 'VERIFY & PAY' }}
      </button>
    </form>

    <a routerLink="/cart" class="back-link">Return to Cart</a>
  </div>
</div>

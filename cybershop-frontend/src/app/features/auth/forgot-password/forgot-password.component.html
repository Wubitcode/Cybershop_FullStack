<div class="forgot-password-page">
  <div class="forgot-password-container">
    <div class="auth-header">
      <h3 class="system-tag">PROTOCOL: 0x882</h3>
      <h2>RECOVER_ACCESS</h2>
    </div>
    
    <div *ngIf="message" 
         class="diagnostic-msg" 
         [ngClass]="{'err-glow': isError, 'success-glow': !isError}">
      <span class="status-icon">{{ isError ? '✖' : '✔' }}</span>
      {{ message }}
    </div>

    <div class="input-group">
      <label>TARGET_USER_EMAIL</label>
      <input 
        type="email" 
        [(ngModel)]="email" 
        placeholder="ADMIN@CYBERSHOP.CA"
        [disabled]="isProcessing">
    </div>

    <button (click)="onResetRequest()" 
            class="commit-btn" 
            [disabled]="isProcessing">
      <span class="btn-text">
        {{ isProcessing ? 'TRANSMITTING...' : 'INITIALIZE_RECOVERY' }}
      </span>
      <div class="scan-bar" *ngIf="isProcessing"></div>
    </button>

    <div class="auth-footer">
      <a routerLink="/auth/login" class="back-link">
        <span class="arrow">←</span> ABORT_AND_RETURN
      </a>
    </div>
  </div>
</div>
